<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026跨年倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        /* 倒计时容器 */
        .countdown-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .countdown {
            font-size: 120px;
            color: #fff;
            text-shadow: 0 0 20px #fff, 0 0 40px #ff0040, 0 0 60px #0099ff;
            opacity: 1;
            transition: all 1s ease-in-out;
        }
        .countdown.hide {
            opacity: 0;
            transform: scale(2);
        }
        /* 祝福容器 */
        .blessing-container {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .blessing {
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 48px;
            color: #fdbebe;
            text-shadow: 0 0 15px #fff, 0 0 30px #a1e7de, 0 0 50px #ff0000;
            opacity: 0;
            transform: translateY(-50px) scale(0.8);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            position: absolute;
            width: 100%;
            left: 0;
        }
        .blessing.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        /* 新年标题 */
        .newyear-title {
            font-size: 150px;
            color: #ffd700;
            text-shadow: 0 0 30px #ffd700, 0 0 60px #ff6a00, 0 0 90px #ff0000;
            opacity: 0;
            transform: scale(0);
            transition: all 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
        }
        .newyear-title.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div class="countdown-container" id="countdownContainer">
        <div class="countdown" id="countdown">5</div>
    </div>
    <div class="newyear-title" id="newyearTitle">2026</div>
    <div class="blessing-container" id="blessingContainer">
        <div class="blessing">新年快乐！万事顺遂！</div>
        <div class="blessing">阖家安康！财源广进！</div>
        <div class="blessing">前程似锦！好运连连！</div>
        <div class="blessing">平安喜乐！得偿所愿！</div>
    </div>
    <canvas id="fireworkCanvas"></canvas>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('fireworkCanvas');
        const countdownEl = document.getElementById('countdown');
        const newyearTitleEl = document.getElementById('newyearTitle');
        const blessingContainer = document.getElementById('blessingContainer');
        const blessings = blessingContainer?.querySelectorAll('.blessing');
        if (!canvas) {
            alert('画布元素未找到！');
        }
        const ctx = canvas?.getContext('2d');

        // 适配屏幕大小
        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 增强版烟花颜色数组（增加渐变色系）
        const COLORS = [
            '#ff0000', '#ff4d4d', '#ff9900', '#ffff00', '#99ff00',
            '#00ff00', '#00ff99', '#0099ff', '#004dff', '#9900ff',
            '#ff00ff', '#ff0099'
        ];
        const BLAST_COLORS = ['#ffffff', '#ffdddd', '#ffffcc', '#ccffff']; // 爆炸中心高亮色

        // 工具函数
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 增强版粒子类（增加拖尾和闪烁效果）
        class Particle {
            constructor(x, y, isBlastCore = false) {
                this.x = x;
                this.y = y;
                this.speed = isBlastCore ? random(6, 10) : random(3, 8);
                this.angle = random(0, Math.PI * 2);
                this.color = isBlastCore ? BLAST_COLORS[Math.floor(random(0, BLAST_COLORS.length))] : COLORS[Math.floor(random(0, COLORS.length))];
                this.size = isBlastCore ? random(4, 6) : random(2, 5);
                this.life = isBlastCore ? 30 : random(60, 90);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1; // 透明度
                this.twinkle = isBlastCore; // 闪烁标记
            }

            update() {
                // 重力影响（分段重力，更真实）
                this.vy += this.life > 30 ? 0.12 : 0.2;
                // 速度衰减（核心粒子衰减更快）
                const decayRate = this.twinkle ? 0.9 : 0.97;
                this.vx *= decayRate;
                this.vy *= decayRate;
                // 更新位置
                this.x += this.vx;
                this.y += this.vy;
                // 生命周期和透明度
                this.life--;
                this.alpha = this.life / (this.twinkle ? 30 : 90);
                // 闪烁效果
                if (this.twinkle) {
                    this.size = this.life % 3 === 0 ? random(3, 7) : this.size;
                }
            }

            draw() {
                if (this.life > 0 && ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    // 拖尾效果
                    if (this.life > 20 && !this.twinkle) {
                        ctx.beginPath();
                        ctx.arc(this.x - this.vx * 2, this.y - this.vy * 2, this.size * 0.6, 0, Math.PI * 2);
                        ctx.fillStyle = `${this.color}80`;
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
        }

        // 大型烟花类（增加升空拖尾和多阶段爆炸）
        class Firework {
            constructor(x = random(canvas.width * 0.05, canvas.width * 0.95), isBig = false) {
                this.x = x;
                this.y = canvas.height;
                this.speed = isBig ? random(-18, -14) : random(-12, -8);
                this.color = COLORS[Math.floor(random(0, COLORS.length))];
                this.exploded = false;
                this.particles = [];
                this.trailParticles = []; // 升空拖尾
                this.isBig = isBig; // 是否为大型烟花
                this.blastStage = 0; // 爆炸阶段
            }

            update() {
                if (!this.exploded) {
                    // 升空移动
                    this.y += this.speed;
                    // 生成升空拖尾
                    if (Math.random() < 0.6) {
                        this.trailParticles.push({
                            x: this.x,
                            y: this.y,
                            size: random(1, 3),
                            alpha: 1,
                            color: this.color
                        });
                    }
                    // 更新拖尾
                    for (let i = this.trailParticles.length - 1; i >= 0; i--) {
                        const t = this.trailParticles[i];
                        t.alpha -= 0.05;
                        t.size *= 0.95;
                        if (t.alpha <= 0) {
                            this.trailParticles.splice(i, 1);
                        }
                    }
                    // 到达高度触发爆炸（大型烟花更高）
                    const blastHeight = this.isBig ? random(canvas.height * 0.15, canvas.height * 0.3) : random(canvas.height * 0.2, canvas.height * 0.4);
                    if (this.y < blastHeight) {
                        this.exploded = true;
                        this.triggerBlast();
                    }
                } else {
                    // 多阶段爆炸
                    if (this.blastStage === 0 && this.particles.length < 50) {
                        setTimeout(() => {
                            this.blastStage = 1;
                            this.triggerBlast(true);
                        }, 300);
                    }
                    // 更新所有粒子
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.update();
                        if (p.life <= 0) {
                            this.particles.splice(i, 1);
                        }
                    }
                }
            }

            // 触发爆炸（支持多阶段）
            triggerBlast(isSecondStage = false) {
                const particleCount = this.isBig ? (isSecondStage ? 150 : 200) : (isSecondStage ? 80 : 120);
                const coreCount = this.isBig ? 30 : 15;
                // 生成核心高亮粒子
                for (let i = 0; i < coreCount; i++) {
                    this.particles.push(new Particle(this.x, this.y, true));
                }
                // 生成普通粒子
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new Particle(this.x, this.y));
                }
            }

            draw() {
                if (!ctx) return;
                // 绘制升空拖尾
                for (const t of this.trailParticles) {
                    ctx.save();
                    ctx.globalAlpha = t.alpha;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
                    ctx.fillStyle = t.color;
                    ctx.fill();
                    ctx.restore();
                }
                // 绘制未爆炸的烟花弹
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.isBig ? 6 : 4, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    // 弹体光晕
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.isBig ? 12 : 8, 0, Math.PI * 2);
                    ctx.fillStyle = `${this.color}30`;
                    ctx.fill();
                } else {
                    // 绘制爆炸粒子
                    this.particles.forEach(p => p.draw());
                }
            }
        }

        // 烟花列表
        let fireworks = [];

        // 鼠标点击生成大型烟花
        if (canvas) {
            canvas.addEventListener('click', (e) => {
                fireworks.push(new Firework(e.clientX, true));
            });
        }

        // 倒计时逻辑
        let countdownNum = 5;
        let isCountdownEnd = false;
        const countdownTimer = setInterval(() => {
            countdownNum--;
            if (countdownNum <= 0) {
                clearInterval(countdownTimer);
                // 倒计时结束动画
                countdownEl.classList.add('hide');
                setTimeout(() => {
                    newyearTitleEl.classList.add('show');
                    isCountdownEnd = true;
                    // 生成全屏烟花秀
                    for (let i = 0; i < 15; i++) {
                        setTimeout(() => {
                            fireworks.push(new Firework(random(canvas.width * 0.05, canvas.width * 0.95), true));
                        }, i * 200);
                    }
                    // 启动祝福轮播
                    startBlessingLoop();
                }, 1000);
            } else {
                countdownEl.textContent = countdownNum;
                // 倒计时触发小型烟花
                fireworks.push(new Firework(random(canvas.width * 0.05, canvas.width * 0.95)));
            }
        }, 1000);

        // 祝福轮播逻辑
        let blessingIndex = 0;
        function startBlessingLoop() {
            if (!blessings) return;
            const showNextBlessing = () => {
                // 移除上一个祝福
                blessings.forEach((b, idx) => {
                    if (idx === blessingIndex) b.classList.remove('active');
                });
                // 切换下一个
                blessingIndex = (blessingIndex + 1) % blessings.length;
                blessings[blessingIndex].classList.add('active');
            };
            // 先显示第一个
            blessings[0].classList.add('active');
            // 后续轮播
            setInterval(showNextBlessing, 3500);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            if (!ctx || !canvas) return;

            // 半透明背景（调整透明度增强拖影）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 倒计时结束后增加自动烟花密度
            const spawnRate = isCountdownEnd ? 0.08 : 0.03;
            if (Math.random() < spawnRate) {
                fireworks.push(new Firework());
            }

            // 更新并绘制所有烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.update();
                fw.draw();
                // 清理已消失的烟花
                if (fw.exploded && fw.particles.length === 0 && fw.trailParticles.length === 0) {
                    fireworks.splice(i, 1);
                }
            }
        }

        // 启动动画
        animate();
    </script>
</body>
</html>
